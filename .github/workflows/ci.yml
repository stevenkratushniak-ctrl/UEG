name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux-amd64:
    name: Linux amd64 qualification checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Go tests
        run: go test ./... -count=1
      - name: Build
        run: go build -o build/ueg ./cmd/ueg
      - name: Cross-implementation tests
        run: python -m unittest discover -s tests -v

  windows-amd64-compile-only:
    name: Windows amd64 compile-only check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Compile package tests without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows-test-binaries
          index=0
          while IFS= read -r package; do
            index=$((index + 1))
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go test -c -o "build/windows-test-binaries/package-${index}.test.exe" "$package"
          done < <(go list ./...)
      - name: Compile CLI without execution
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o build/ueg-windows-amd64.exe ./cmd/ueg

  release-binaries:
    name: Reproducible cross-build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: ueg-binaries
          path: dist/
